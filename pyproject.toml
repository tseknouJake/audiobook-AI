[project]
name = "audiobook-ai"
version = "0.1.0"
description = "Turn course readings into listenable audio with a read-along player"
readme = "README.md"
authors = [
    { name = "tseknouJake", email = "jakelockitch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "imageio-ffmpeg>=0.8.1",
    "kokoro>=0.9.4",
    "numpy>=2.5.4",
    "pymupdf>=2.1",
    "pyobjc-framework-cocoa>=13.0 ; sys_platform == 'darwin'",
    "pypdf>=7.0.1",
    "pysbd>=0.3.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "send2trash>=2.1.0",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
audiobook = "audiobook_ai.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
