<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reader · Audiobook AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <a class="back" href="/">← Library</a>
  <div class="name" id="name"></div>
  <select id="chapters" aria-label="Jump to section" class="hidden"></select>
</div>

<div class="state" id="state">Loading…</div>
<article class="script hidden" id="script"></article>

<section class="tools hidden" id="tools">
  <details>
    <summary>Fix a word, or change the voice</summary>
    <p>The script is a text file you can edit: <code id="script-path"></code>.
      Save your changes, then re-record. Gemini isn't asked again, so this uses no free-tier requests.</p>
    <div class="row">
      <select id="voice" aria-label="Voice"></select>
      <button class="btn" id="rerecord">Re-record audio</button>
    </div>
  </details>
</section>

<button class="btn jump hidden" id="jump">↓ Back to where it's reading</button>

<div class="player hidden" id="player">
  <div class="inner">
    <div class="scrub">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Position">
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <div class="left" id="chapter-label"></div>
      <div class="mid">
        <button class="ctl" id="prev" title="Previous sentence (←)" aria-label="Previous sentence">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="ctl" id="back15" title="Back 15 seconds (J)" aria-label="Back 15 seconds">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>15
        </button>
        <button class="btn primary play" id="play" title="Play / pause (space)" aria-label="Play">
          <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button class="ctl" id="fwd15" title="Forward 15 seconds (L)" aria-label="Forward 15 seconds">15
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="ctl" id="next" title="Next sentence (→)" aria-label="Next sentence">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
      </div>
      <div class="right">
        <div class="speed" title="Speed ( [ and ] )">
          <button id="slower" aria-label="Slower">−</button>
          <span id="rate">1.0×</span>
          <button id="faster" aria-label="Faster">+</button>
        </div>
        <a class="btn icon" id="download" title="Download MP3" aria-label="Download MP3">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>
        </a>
      </div>
    </div>
    <div class="keys"><kbd>space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> sentence · <kbd>J</kbd> <kbd>L</kbd> 15 s · <kbd>[</kbd> <kbd>]</kbd> speed · click any sentence to jump there</div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const slug = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop());
const audio = new Audio();
audio.preload = "auto";
let segs = [], els = [], chapters = [], active = -1;
let followPausedUntil = 0, dragging = false;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

function fmt(t) {
  t = Math.max(0, Math.floor(t || 0));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}

async function load() {
  const res = await fetch(`/api/readings/${encodeURIComponent(slug)}`);
  if (!res.ok) { $("#state").textContent = "This reading doesn't exist."; return; }
  const data = await res.json();
  document.title = `${data.title} · Audiobook AI`;
  $("#name").textContent = data.title;
  if (data.status !== "done" || !data.timing || !data.audio_url) {
    const msg = data.status === "error" ? `Something went wrong: ${data.error}` : "Still being prepared… this page will open the reading when it's ready.";
    $("#state").textContent = msg;
    if (data.status !== "error") setTimeout(load, 2000);
    return;
  }
  render(data);
}

function render(data) {
  segs = data.timing.segments;
  chapters = data.timing.chapters || [];
  const out = [];
  let para = null;
  for (const s of segs) {
    if (s.kind === "heading") {
      if (para !== null) { out.push("</p>"); para = null; }
      const level = Math.min(4, Math.max(1, s.level));
      out.push(`<h${level} data-i="${s.id}">${esc(s.text)}</h${level}>`);
    } else {
      if (para !== s.para) {
        if (para !== null) out.push("</p>");
        out.push("<p>");
        para = s.para;
      }
      out.push(`<span class="s" data-i="${s.id}">${esc(s.text)}</span> `);
    }
  }
  if (para !== null) out.push("</p>");
  $("#script").innerHTML = out.join("");
  els = segs.map((s) => $("#script").querySelector(`[data-i="${s.id}"]`));

  if (chapters.length > 1) {
    $("#chapters").innerHTML = `<option value="">Sections</option>` +
      chapters.map((c, i) => `<option value="${i}">${esc(c.title)}</option>`).join("");
    $("#chapters").classList.remove("hidden");
  }
  $("#script-path").textContent = data.script_path;
  $("#download").href = data.audio_url;
  $("#download").download = `${slug}.mp3`;
  fetch("/api/voices").then((r) => r.json()).then((vs) => {
    $("#voice").innerHTML = vs.map((v) => `<option value="${esc(v.id)}"${v.id === data.voice ? " selected" : ""}>${esc(v.label)}</option>`).join("");
  });

  $("#state").classList.add("hidden");
  ["#script", "#tools", "#player"].forEach((s) => $(s).classList.remove("hidden"));

  audio.src = data.audio_url;
  audio.playbackRate = parseFloat(store.get("rate") || "1") || 1;
  showRate();
  const saved = parseFloat(store.get(`pos:${slug}`) || "0");
  audio.addEventListener("loadedmetadata", () => {
    $("#seek").max = audio.duration;
    $("#dur").textContent = fmt(audio.duration);
    if (saved > 0 && saved < audio.duration - 2) audio.currentTime = saved;
    tick(true);
  }, {once: true});
}

// ---------- highlighting ----------

function indexAt(t) {
  let lo = 0, hi = segs.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (segs[mid].start <= t + 0.05) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function chapterAt(t) {
  let found = null;
  for (const c of chapters) if (c.start <= t + 0.05) found = c;
  return found;
}

function setActive(i, forceScroll) {
  if (i === active && !forceScroll) return;
  if (active >= 0 && els[active]) els[active].classList.remove("active");
  active = i;
  const el = els[i];
  if (!el) return;
  el.classList.add("active");
  const ch = chapterAt(segs[i].start);
  $("#chapter-label").textContent = ch ? ch.title : "";
  follow(forceScroll);
}

function offScreen(el) {
  const r = el.getBoundingClientRect();
  const bottom = window.innerHeight - $("#player").offsetHeight;
  return r.top < 70 || r.bottom > bottom - 30;
}

function follow(force) {
  const el = els[active];
  if (!el) return;
  const userScrolling = Date.now() < followPausedUntil;
  if (offScreen(el) && (force || !userScrolling)) {
    el.scrollIntoView({block: "center", behavior: force ? "auto" : "smooth"});
  }
  updateJump();
}

function updateJump() {
  const el = els[active];
  $("#jump").classList.toggle("hidden", !el || !offScreen(el) || audio.paused && active < 0);
}

function tick(force) {
  const t = audio.currentTime;
  if (!dragging) $("#seek").value = t;
  $("#cur").textContent = fmt(t);
  if (segs.length) setActive(indexAt(t), force === true);
}

let raf = null;
function loop() { tick(); raf = audio.paused ? null : requestAnimationFrame(loop); }

// ---------- controls ----------

function seekTo(t, play) {
  audio.currentTime = Math.max(0, Math.min(t, (audio.duration || t) - 0.05));
  followPausedUntil = 0;
  tick(true);
  if (play) audio.play();
}
function togglePlay() { audio.paused ? audio.play() : audio.pause(); }
function prevSentence() {
  if (active < 0) return seekTo(0);
  const into = audio.currentTime - segs[active].start;
  seekTo(segs[into > 1.2 || active === 0 ? active : active - 1].start);
}
function nextSentence() { if (active < segs.length - 1) seekTo(segs[active + 1].start); }
function showRate() { $("#rate").textContent = `${audio.playbackRate.toFixed(1)}×`; }
function changeRate(delta) {
  audio.playbackRate = Math.round(Math.min(3, Math.max(0.5, audio.playbackRate + delta)) * 10) / 10;
  store.set("rate", audio.playbackRate);
  showRate();
}
function savePos() { if (audio.currentTime > 0) store.set(`pos:${slug}`, audio.currentTime.toFixed(1)); }

audio.addEventListener("play", () => {
  $("#icon-play").classList.add("hidden"); $("#icon-pause").classList.remove("hidden");
  $("#play").setAttribute("aria-label", "Pause");
  if (!raf) loop();
});
audio.addEventListener("pause", () => {
  $("#icon-play").classList.remove("hidden"); $("#icon-pause").classList.add("hidden");
  $("#play").setAttribute("aria-label", "Play");
  savePos();
});
audio.addEventListener("seeked", () => tick());
audio.addEventListener("timeupdate", () => tick()); // backup for when animation frames pause
setInterval(() => { if (!audio.paused) savePos(); }, 5000);
window.addEventListener("pagehide", savePos);

$("#play").addEventListener("click", togglePlay);
$("#prev").addEventListener("click", prevSentence);
$("#next").addEventListener("click", nextSentence);
$("#back15").addEventListener("click", () => seekTo(audio.currentTime - 15));
$("#fwd15").addEventListener("click", () => seekTo(audio.currentTime + 15));
$("#slower").addEventListener("click", () => changeRate(-0.1));
$("#faster").addEventListener("click", () => changeRate(0.1));
$("#jump").addEventListener("click", () => { followPausedUntil = 0; follow(true); });

const seek = $("#seek");
seek.addEventListener("input", () => { dragging = true; $("#cur").textContent = fmt(+seek.value); });
seek.addEventListener("change", () => { dragging = false; seekTo(+seek.value); });

$("#chapters").addEventListener("change", (e) => {
  const c = chapters[+e.target.value];
  if (c) seekTo(c.start, !audio.paused);
  e.target.value = "";
});

$("#script").addEventListener("click", (e) => {
  if (window.getSelection().toString()) return; // let people select text to copy into notes
  const el = e.target.closest("[data-i]");
  if (el) seekTo(segs[+el.dataset.i].start, true);
});

["wheel", "touchmove"].forEach((ev) => window.addEventListener(ev, () => { followPausedUntil = Date.now() + 6000; }, {passive: true}));
window.addEventListener("scroll", () => requestAnimationFrame(updateJump), {passive: true});

// Buttons lose focus after a click, so space never "clicks" them a second time.
document.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => b.blur()));

document.addEventListener("keydown", (e) => {
  const target = e.target instanceof Element ? e.target : null;
  if (target?.closest("input[type=text], textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const actions = {
    " ": togglePlay, k: togglePlay, ArrowLeft: prevSentence, ArrowRight: nextSentence,
    j: () => seekTo(audio.currentTime - 15), l: () => seekTo(audio.currentTime + 15),
    "[": () => changeRate(-0.1), "]": () => changeRate(0.1),
  };
  const byCode = {BracketLeft: "[", BracketRight: "]", KeyJ: "j", KeyK: "k", KeyL: "l", Space: " "};
  const fn = actions[e.key.length === 1 ? e.key.toLowerCase() : e.key] || actions[byCode[e.code]];
  if (fn) { e.preventDefault(); fn(); }
  if (["PageUp", "PageDown", "ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) followPausedUntil = Date.now() + 6000;
});

$("#rerecord").addEventListener("click", async () => {
  $("#rerecord").disabled = true;
  audio.pause();
  const res = await fetch(`/api/readings/${encodeURIComponent(slug)}/rebuild`, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({voice: $("#voice").value}),
  });
  if (!res.ok) { $("#rerecord").disabled = false; alert((await res.json()).detail || "Could not re-record"); return; }
  ["#script", "#tools", "#player", "#jump"].forEach((s) => $(s).classList.add("hidden"));
  $("#state").classList.remove("hidden");
  $("#state").textContent = "Re-recording… this page will reload when it's ready.";
  const wait = async () => {
    const d = await (await fetch(`/api/readings/${encodeURIComponent(slug)}`)).json();
    if (d.status === "done") location.reload();
    else if (d.status === "error") $("#state").textContent = `Something went wrong: ${d.error}`;
    else setTimeout(wait, 2000);
  };
  setTimeout(wait, 1500);
});

load();
</script>
</body>
</html>
